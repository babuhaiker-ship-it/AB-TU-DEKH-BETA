# This file configures the bot service for deployment on Render.
# See https://render.com/docs/blueprint-spec for a full reference.

services:
  # ---------------------
  # Bot Service (Backend)
  # ---------------------
  # This defines the Pyrogram bot and its FastAPI backend.
  # It's a "Web Service" to ensure it gets a public URL that the
  # separate frontend can connect to.
  - type: web
    name: bot
    # Use Docker to build and run this service.
    env: docker
    # The context and Dockerfile are in the root directory.
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # Render will automatically forward external traffic on port 8080
    # to this service.
    # Environment variables required by the bot.
    envVars:
      # The MONGO_URI and other secrets should be set manually
      # in the Render dashboard as secrets. 'sync: false' tells Render
      # not to store these values in the yaml file.
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: OWNER_ID
        sync: false
      # You can add other non-sensitive variables from config.py here if needed.
