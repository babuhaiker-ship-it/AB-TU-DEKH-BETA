name: Build & Push Single Docker Image

on:
  push:
    branches: [ lifespan-manager-fix ]  # Change to your branch if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push
        run: |
          docker build -t ghcr.io/godfatherpy/ab-tu-dekh-beta:latest .
          docker push ghcr.io/godfatherpy/ab-tu-dekh-beta:latest
